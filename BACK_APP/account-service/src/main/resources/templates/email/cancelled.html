<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background-color:#faf9f5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#faf9f5" style="background-color:#faf9f5;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:560px;">

        <tr>
          <td align="center" style="padding:0 0 20px 0; font-family:Georgia,'Times New Roman',serif; font-size:22px; font-weight:bold; color:#1f1e1d;">
            diary<span style="color:#f28c00;">-app</span>
          </td>
        </tr>

        <tr>
          <td bgcolor="#ffffff" style="background-color:#ffffff; border:1px solid #e8e6dc; border-radius:14px; padding:36px 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="padding-bottom:8px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td align="center" width="48" height="48" bgcolor="#f0eee6" style="width:48px; height:48px; border-radius:24px; background-color:#f0eee6; color:#6b6a68; font-size:22px; font-weight:bold; font-family:Arial,sans-serif;">&#10005;</td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td align="center" style="padding:12px 0 6px 0; font-family:Georgia,'Times New Roman',serif; font-size:24px; color:#1f1e1d;">
                  Subscription cancelled
                </td>
              </tr>
              <tr>
                <td align="center" style="padding:0 0 28px 0; font-family:Arial,Helvetica,sans-serif; font-size:15px; line-height:22px; color:#6b6a68;">
                  Hi {{name}}, your Premium subscription will not be renewed.
                </td>
              </tr>
              <tr>
                <td align="center" style="padding:0 0 28px 0;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td align="center" bgcolor="#fff3e0" style="background-color:#fff3e0; border:1px solid #f6d9a8; border-radius:12px; padding:16px 28px;">
                        <div style="font-family:Arial,Helvetica,sans-serif; font-size:13px; color:#6b6a68; padding-bottom:4px;">Premium stays active until</div>
                        <div style="font-family:Georgia,'Times New Roman',serif; font-size:24px; font-weight:bold; color:#1f1e1d;">{{expiresAt}}</div>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td align="center" style="padding:0; font-family:Arial,Helvetica,sans-serif; font-size:14px; line-height:21px; color:#6b6a68;">
                  You keep all Premium features until that date.<br>
                  After it ends, you can choose a new plan at any time.
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding:20px 16px 0 16px; font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:18px; color:#9b9a97;">
            If you did not cancel your subscription, please contact us.
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
