<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background-color:#faf9f5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#faf9f5" style="background-color:#faf9f5;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:560px;">

        <tr>
          <td align="center" style="padding:0 0 20px 0; font-family:Georgia,'Times New Roman',serif; font-size:22px; font-weight:bold; color:#1f1e1d;">
            diary<span style="color:#f28c00;">-app</span>
          </td>
        </tr>

        <tr>
          <td bgcolor="#ffffff" style="background-color:#ffffff; border:1px solid #e8e6dc; border-radius:14px; padding:36px 32px;">

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="padding-bottom:8px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td align="center" width="48" height="48" bgcolor="#fff3e0" style="width:48px; height:48px; border-radius:24px; background-color:#fff3e0; color:#f28c00; font-size:24px; font-weight:bold; font-family:Arial,sans-serif;">&#10003;</td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td align="center" style="padding:12px 0 6px 0; font-family:Georgia,'Times New Roman',serif; font-size:24px; color:#1f1e1d;">
                  Payment received
                </td>
              </tr>
              <tr>
                <td align="center" style="padding:0 0 24px 0; font-family:Arial,Helvetica,sans-serif; font-size:15px; line-height:22px; color:#6b6a68;">
                  Thank you! Your Premium subscription is now active.
                </td>
              </tr>
              <tr>
                <td align="center" style="padding:0 0 28px 0; font-family:Georgia,'Times New Roman',serif; font-size:38px; font-weight:bold; color:#1f1e1d;">
                  {{amount}}
                </td>
              </tr>
            </table>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top:1px solid #e8e6dc;">
              <tr>
                <td style="padding:14px 0; border-bottom:1px solid #f0eee6; font-family:Arial,Helvetica,sans-serif; font-size:14px; color:#6b6a68;">Plan</td>
                <td align="right" style="padding:14px 0; border-bottom:1px solid #f0eee6; font-family:Arial,Helvetica,sans-serif; font-size:14px; color:#1f1e1d; font-weight:bold;">{{plan}}</td>
              </tr>
              <tr>
                <td style="padding:14px 0; border-bottom:1px solid #f0eee6; font-family:Arial,Helvetica,sans-serif; font-size:14px; color:#6b6a68;">Payment method</td>
                <td align="right" style="padding:14px 0; border-bottom:1px solid #f0eee6; font-family:Arial,Helvetica,sans-serif; font-size:14px; color:#1f1e1d; font-weight:bold;">{{card}}</td>
              </tr>
              <tr>
                <td style="padding:14px 0; font-family:Arial,Helvetica,sans-serif; font-size:14px; color:#6b6a68;">Valid until</td>
                <td align="right" style="padding:14px 0; font-family:Arial,Helvetica,sans-serif; font-size:14px; color:#1f1e1d; font-weight:bold;">{{expiresAt}}</td>
              </tr>
            </table>

          </td>
        </tr>

        <tr>
          <td align="center" style="padding:20px 16px 0 16px; font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:18px; color:#9b9a97;">
            You can find this payment in Profile &rarr; Purchases.<br>
            If you did not make this purchase, please contact us.
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
